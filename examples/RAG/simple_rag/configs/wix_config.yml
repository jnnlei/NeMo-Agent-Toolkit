general:
  telemetry:
    tracing:
      weave:
        _type: weave
        project: "nat-simple"
        
memory:
  saas_memory:
    _type: mem0_memory

retrievers:
  vllm_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "vllm_docs"
    embedding_model: milvus_embedder
    top_k: 10

  wix_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "wix_collection"
    embedding_model: milvus_embedder
    top_k: 10
    
  wix_retriever_with_rerank:
    _type: milvus_rerank_retriever 
    uri: http://localhost:19530
    collection_name: "wix_collection"
    embedding_model: milvus_embedder
    reranker_model_name: "nvidia/llama-3.2-nv-rerankqa-1b-v2"    
    top_k: 6                        # 最终返回给 Agent 的文档数
    expansion_factor: 3        # 初始检索 5*3=15 个文档进行 rerank

functions:
  vllm_retriever_tool:
    _type: nat_retriever
    retriever: vllm_retriever
    topic: Retrieve information about vLLM
    
  wix_retriever_tool:
    _type: nat_retriever
    retriever: wix_retriever
    topic: Retrieve information about Wix features and support
    description: |
      Retrieves information from the Wix Help Center knowledge base.
      Use this tool for questions about website building, features, accounts, domains, or support, even if "Wix" is not explicitly mentioned in the query.
      Assume generic questions (e.g., "how to add a page", "change domain settings") are referring to the Wix platform.
      Topics covered include:
      - Website building and editing
      - Features and functionality
      - Account and settings
      - Apps and integrations
      - Domains and email
      - E-commerce and bookings

  wix_retriever_tool_with_rerank:
    _type: nat_retriever
    retriever: wix_retriever_with_rerank
    topic: Retrieve information about Wix features and support with reranking
    description: |
      Retrieves information from the Wix Help Center knowledge base.
      Use this tool for questions about website building, features, accounts, domains, or support, even if "Wix" is not explicitly mentioned in the query.
      Assume generic questions (e.g., "how to add a page", "change domain settings") are referring to the Wix platform.
      Topics covered include:
      - Website building and editing
      - Features and functionality
      - Account and settings
      - Apps and integrations
      - Domains and email
      - E-commerce and bookings
    
  add_memory:
    _type: add_memory
    memory: saas_memory
    description: |
      Add any facts about user preferences to long term memory. Always use this if users mention a preference.
      The input to this tool should be a string that describes the user's preference, not the question or answer.
  get_memory:
    _type: get_memory
    memory: saas_memory
    description: |
      Always call this tool before calling any other tools, even if the user does not mention to use it.
      The question should be about user preferences which will help you format your response.
      For example: "How does the user like responses formatted?"

  # To use these tools you will need to install the "nvidia-nat[langchain]" package
  web_search_tool:
    _type: tavily_internet_search
    max_results: 5
    # Tavily internet search requires an API Key. You can specify it here, or export the TAVILY_API_KEY environment variable
    # api_key: "{your key goes here}"
  code_generation_tool:
    _type: code_generation
    llm_name: nim_llm
    description: |
      Always call this tool to generate python code. Returns a code snippet which MUST be included in your response.

  prompt_optimizer:
    _type: prompt_init
    optimizer_llm: nim_llm
    system_objective: "Answer questions about Wix using the provided tools and knowledge base."

  prompt_recombiner:
    _type: prompt_recombiner
    optimizer_llm: nim_llm
    system_objective: "Answer questions about Wix using the provided tools and knowledge base."

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.1
    max_tokens: 4096
    top_p: 0.9
    optimizable_params:
      - temperature
      - top_p
      # - max_tokens
    search_space:
      temperature:
        low: 0.0
        high: 0.3
        step: 0.1
      top_p:
        low: 0.8
        high: 1.0
        step: 0.1
      # max_tokens:
      #   low: 1024
      #   high: 4096
      #   step: 128

  nim_rag_eval_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 8
  nim_trajectory_eval_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 1024

embedders:
  milvus_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

workflow:
  _type: react_agent
  tool_names:
    - vllm_retriever_tool
    # - wix_retriever_tool  
    - wix_retriever_tool_with_rerank
    - add_memory
    - get_memory
    - web_search_tool
    - code_generation_tool
  verbose: true
  llm_name: nim_llm
  
  # 配置系统提示词和额外指令
  system_prompt: |
    Answer the following questions as best you can. You may ask the human to use the following tools:

    {tools}

    You may respond in one of two formats.
    Use the following format exactly to ask the human to use a tool:

    Question: the input question you must answer
    Thought: you should always think about what to do
    Action: the action to take, should be one of [{tool_names}]
    Action Input: the input to the action (if there is no required input, include "Action Input: None")
    Observation: wait for the human to respond with the result from the tool, do not assume the response

    ... (this Thought/Action/Action Input/Observation can repeat N times. If you do not need to use a tool, or after asking the human to use any tools and waiting for the human to respond, you might know the final answer.)
    Use the following format once you have the final answer:

    Thought: I now know the final answer
    Final Answer: the final answer to the original input question

  optimizable_params:
    - system_prompt

  search_space:
    system_prompt:
      is_prompt: true
      prompt_purpose: "Instructions for the ReAct agent. IMPORTANT: You MUST preserve the exact placeholders {tools} and {tool_names} in the prompt, as they are required for the agent to function."
      prompt: |
        Answer the following questions as best you can. You may ask the human to use the following tools:

        {tools}

        You may respond in one of two formats.
        Use the following format exactly to ask the human to use a tool:

        Question: the input question you must answer
        Thought: you should always think about what to do
        Action: the action to take, should be one of [{tool_names}]
        Action Input: the input to the action (if there is no required input, include "Action Input: None")
        Observation: wait for the human to respond with the result from the tool, do not assume the response

        ... (this Thought/Action/Action Input/Observation can repeat N times. If you do not need to use a tool, or after asking the human to use any tools and waiting for the human to respond, you might know the final answer.)
        Use the following format once you have the final answer:

        Thought: I now know the final answer
        Final Answer: the final answer to the original input question

eval:
  general:
    verbose: true
    max_concurrency: 2
    output:
      dir: eval_output
      cleanup: false
    dataset:
      _type: json
      file_path: my_data/wixqa_expertwritten_tiny.json
    # profiler:
    #   # Compute inter query token uniqueness
    #   token_uniqueness_forecast: true
    #   # Compute expected workflow runtime
    #   workflow_runtime_forecast: true
    #   # Compute inference optimization metrics
    #   compute_llm_metrics: true
    #   # Avoid dumping large text into the output CSV (helpful to not break structure)
    #   csv_exclude_io_text: true
    #   # Idenitfy common prompt prefixes
    #   prompt_caching_prefixes:
    #     enable: true
    #     min_frequency: 0.1
    #   bottleneck_analysis:
    #     # Can also be simple_stack
    #     enable_nested_stack: true
    #   concurrency_spike_analysis:
    #     enable: true
    #     spike_threshold: 7

  evaluators:
    accuracy:
      _type: ragas
      metric: AnswerAccuracy
      llm_name: nim_rag_eval_llm
    groundedness:
      _type: ragas
      metric: ResponseGroundedness
      llm_name: nim_rag_eval_llm
    relevance:
      _type: ragas
      metric: ContextRelevance
      llm_name: nim_rag_eval_llm
    # trajectory_accuracy:
    #   _type: trajectory
    #   llm_name: nim_trajectory_eval_llm

optimizer:
  output_path: "optimizer_results"
  # Numeric (Optuna)
  numeric:
    enabled: false
    n_trials: 12
    sampler: grid
  # Prompt (Genetic Algorithm)
  prompt:
    enabled: true
    prompt_population_init_function: "prompt_optimizer"
    prompt_recombination_function: "prompt_recombiner"  # optional
    ga_population_size: 8
    ga_generations: 3
    ga_offspring_size: 6        # optional; defaults to pop_size - elitism
    ga_crossover_rate: 0.7
    ga_mutation_rate: 0.2
    ga_elitism: 2
    ga_selection_method: "tournament"  # or "roulette"
    ga_tournament_size: 3
    ga_parallel_evaluations: 8
    ga_diversity_lambda: 0.0
  # Evaluation
  reps_per_param_set: 1
  eval_metrics:
    accuracy:
      evaluator_name: "accuracy"
      direction: "maximize"
      weight: 0.8
    relevance:
      evaluator_name: "relevance"
      direction: "maximize"
      weight: 0.2